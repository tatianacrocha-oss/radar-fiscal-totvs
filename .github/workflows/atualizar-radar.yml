name: Atualizar Radar Fiscal

on:
  schedule:
    - cron: "0 11 * * *" # 08:00 horário de Brasília (UTC-3, sem horário de verão)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  coletar-noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar o coletor de notícias
        run: python radar_fiscal_scraper.py

      - name: Publicar dados atualizados
        run: |
          git config user.name "radar-fiscal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add noticias_data.js noticias_historico.json
          git diff --cached --quiet && echo "Nada novo para publicar." || git commit -m "Atualiza notícias do dia"
          git push
